# Default configuration. Schema and rationale: config/schema.md
#
# `det_conf`, `tau_near` and `tau_far` are the ALL-DATA leave-one-clip-out
# selection (outputs/loco_vlm.json, `all_data_selected`), so that the shipped
# artifact in outputs/ and the numbers in WRITEUP.md come from one config.
#
# READ THE DENOMINATOR BEFORE READING THESE AS A RESULT. All-data selection is
# not held out: it scores F1 0.703 on the same 8 clips that chose it, while the
# held-out LOCO estimate for the same procedure is 0.667. The 0.036 gap is the
# overfitting this config carries. The remaining tunables below are untuned
# first guesses derived from the ground truth's geometry; LOCO varied only the
# three (design-plan s6a.2).

seed: 0
device: cuda:0

paths:
  videos: Videos
  # Labeling/contact-sheet use ONLY. Downscaled to max width 1600, so
  # data/frames/gt1125_06/ is 1600x900, not 3840x2160. The pipeline decodes
  # from `videos` at native resolution and never reads this.
  frames: data/frames
  ground_truth: data/ground_truth.json
  outputs: outputs
  vlm_cache: data/vlm_cache

detector:
  model_id: Roboflow/rf-detr-large
  # Pinned. A null revision makes from_pretrained contact the Hub to resolve
  # "latest", which is both a reproducibility hole (today's `main` is not next
  # month's) and, observed here, a hang on a slow connection.
  revision: f62f7dd5252b61097cbace33886045816dadbde9
  classes: [0, 1, 2, 3, 5, 7]   # COCO: person, bicycle, car, motorcycle, bus, truck

vlm:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  max_new_tokens: 512
  temperature: 0.0        # greedy; required for determinism
  max_pixels_per_frame: 401408   # 512*28*28; bounds VLM tokens per frame
  batch_size: 1           # batching perturbs outputs even at t=0

tracker:
  impl: roboflow-trackers
  name: bytetrack
  gmc: orb
  # Confidence floor for detections handed to the TRACKER -- far below
  # det_conf on purpose. ByteTrack's second association pass uses
  # low-confidence detections to carry a track through detector flicker;
  # pre-filtering at det_conf deletes that pool and splits one person into
  # several sequential tracks on the night and CIF clips.
  det_floor: 0.10

openvocab:
  model_id: IDEA-Research/grounding-dino-base
  revision: 12bdfa3120f3e7ec7b434d90674b3396eccf88eb
  box_threshold: 0.27
  text_threshold: 0.25

tunable:
  # The three LOCO-selected knobs. Previous untuned guesses: 0.50/0.15/0.30.
  det_conf: 0.65         # tracker high-confidence threshold, NOT a pre-filter
  tau_near: 0.10
  tau_far: 0.25          # constraint: must exceed tau_near
  min_dwell_s: 0.5       # constraint: must be < 0.75 (shortest GT positive)
  smooth_window_s: 0.4   # floored at 3 frames per clip at runtime
  door_conf_thresh: 0.30    # open-vocab 'open car door' confidence
  context_pad_s: 1.0
  n_vlm_frames: 12
  crop_margin: 0.25
  vlm_conf_thresh: 0.5
